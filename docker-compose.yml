services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./backend:/app", "./stocks:/app/stocks"]
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  web:
    build: ./frontend
    command: npm run dev
    volumes: ["./frontend:/app"]
    ports: ["3000:3000"]
    depends_on: [api]
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: stocks }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
